[pytest]
markers =
    db: tests that require AlanStrats SQL Server connection
    polygon: tests that require POLYGON_API_KEY and live network
    slow: slow end-to-end tests (skip with -m "not slow")
testpaths = tests
# importlib mode leaves sys.path alone: the default prepend mode inserts the checkout's parent (this tree is a package),
# which beside the live checkout puts a foreign alan_trader on sys.path — test_bootstrap_imports_this_checkout_only
# rightly refuses that.
addopts = --import-mode=importlib
